<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110c">
<title>Crônicas da Manutenção</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#14110c;--card:#241c12;--gold:#c9a24b;--gold2:#ecd592;--ink:#efe4c8;--mute:#a8987a;--green:#4d7045;--red:#b5492f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:'IM Fell English',Georgia,serif;background:radial-gradient(ellipse at top,#33271a,#14110c 65%) fixed}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3,.os,.tag,.btn,.stat b{font-family:Cinzel,Georgia,serif}
h1{margin:6px 0 2px;text-align:center;color:var(--gold2);font-size:26px;letter-spacing:2px;text-shadow:0 0 18px #c9a24b66}
.sub{text-align:center;color:var(--mute);font-style:italic;margin:0 0 16px}
.orn{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{border:1px solid #c9a24b55;border-radius:10px;padding:10px 4px;text-align:center;background:#1b150e}
.stat b{display:block;font-size:24px;color:var(--gold2)}
.stat span{font-size:12px;color:var(--mute)}
.stat.red b{color:#e0745a}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{background:linear-gradient(#3a2d1a,#261d10);color:var(--gold2);border:1px solid var(--gold);border-radius:10px;padding:11px 16px;font-size:13px;letter-spacing:1px;cursor:pointer}
.btn.ghost{background:none;border-color:#c9a24b66;color:var(--mute)}
.msg{text-align:center;color:var(--gold2);margin:12px 0;font-style:italic}
h2{font-size:15px;letter-spacing:2px;color:var(--gold);margin:26px 0 10px;display:flex;align-items:center;gap:10px;text-transform:uppercase}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
h2.red{color:#e0745a}h2.red::after{background:linear-gradient(90deg,#e0745a,transparent)}
.card{position:relative;background:linear-gradient(160deg,#2d2315,var(--card));border:1px solid var(--gold);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px;box-shadow:inset 0 0 0 3px #14110c,inset 0 0 0 4px #c9a24b44,0 6px 16px #0008;cursor:pointer}
.card.late{border-color:var(--red);box-shadow:inset 0 0 0 3px #14110c,inset 0 0 0 4px #b5492f66,0 0 16px #b5492f44}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.os{font-size:12px;color:var(--gold);letter-spacing:1px}
.tag{font-size:10px;letter-spacing:1px;border:1px solid #c9a24b88;border-radius:20px;padding:3px 9px;color:var(--gold2);text-transform:uppercase}
.card h3{margin:8px 0 4px;font-size:17px;color:var(--ink);line-height:1.25}
.work{color:var(--mute);font-style:italic;font-size:14px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:10px;border-top:1px dashed #c9a24b44;padding-top:8px}
.warn{margin-top:8px;color:#f0a48e;font-size:14px}
.desc{margin:8px 0 0;font-size:14px;color:#cbbd9c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.desc.open{display:block}
.empty{text-align:center;border:1px dashed var(--gold);border-radius:14px;padding:30px 18px;margin-top:20px;color:var(--mute)}
.ov{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at top,#3a2c1a,#0e0b07 70%);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
.cnt{color:var(--mute);font-size:13px;margin:0 0 26px;font-style:italic}
.hs{position:relative;width:min(290px,78vw);aspect-ratio:5/7;border-radius:22px;background:linear-gradient(160deg,#4a3820,#2a1f12);border:3px solid var(--gold);box-shadow:inset 0 0 0 4px #14110c,inset 0 0 0 6px #c9a24b66,0 14px 34px #000a,0 0 30px #c9a24b33;padding:34px 16px 18px;display:flex;flex-direction:column;animation:deal .45s ease-out}
@keyframes deal{from{transform:translateY(70px) rotate(-6deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.art{height:34%;border-radius:50% 50% 12px 12px/40% 40% 12px 12px;background:radial-gradient(circle,#5d7a52,#1f2c1c);border:2px solid var(--gold);display:grid;place-items:center;font-size:54px;color:var(--gold2);text-shadow:0 0 20px #ecd592aa}
.banner{font-family:Cinzel,serif;margin:10px -22px 0;padding:6px 16px;text-align:center;background:linear-gradient(90deg,#14110c,#5a4322,#14110c);border-block:1px solid var(--gold);color:var(--gold2);font-size:14px;line-height:1.2;max-height:3.5em;overflow:hidden}
.type{text-align:center;font-size:12px;color:var(--mute);margin:6px 0;font-style:italic}
.box{flex:1;overflow:hidden;background:#e9dcb8;color:#2b2111;border-radius:8px;padding:9px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.gem{position:absolute;top:-14px;left:-12px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ecd592,#8a6a24);border:2px solid #14110c;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Cinzel,serif;font-weight:700;color:#14110c;font-size:17px;line-height:1;box-shadow:0 3px 8px #000a}
.gem small{font-size:8px;font-weight:500}
.gem.red{background:radial-gradient(circle at 35% 30%,#f0a48e,#8a2f1c);color:#fff}
.gem.g2{top:auto;bottom:-14px}.gem.g3{top:auto;left:auto;right:-12px;bottom:-14px}
.ask{text-align:center;margin:30px 0 12px;font-family:Cinzel,serif;color:var(--gold2);font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(340px,100%)}
.opts .btn{padding:12px 8px;font-size:12px;line-height:1.3}
.opts .btn small{display:block;color:var(--mute);font-family:'IM Fell English',serif;letter-spacing:0;font-size:13px}
.later{margin-top:16px;background:none;border:0;color:var(--mute);font-style:italic;font-size:14px;cursor:pointer}
.plan{border:1px solid #c9a24b55;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#1b150e;font-size:14px}
.plan b{display:block;font-family:Cinzel,serif;font-size:12px;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
.plan i{color:var(--mute);font-size:12px}
.wrap{padding-bottom:100px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#100c07;border-top:1px solid var(--gold);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:15px 0;background:none;border:0;color:var(--mute);font-family:Cinzel,serif;letter-spacing:1px;font-size:13px;cursor:pointer}
.tabs .on{color:var(--gold2);box-shadow:inset 0 2px 0 var(--gold)}
.btn.done{padding:8px 14px;font-size:11px;margin-top:10px;border-color:#6f9a5f;color:#c2e0b0}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
.prow .btn{margin:0;flex:none}
.rew{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);z-index:70;display:flex;gap:14px;align-items:center;padding:14px 24px;border-radius:16px;background:linear-gradient(#4a3820,#2a1f12);border:2px solid var(--gold);box-shadow:0 0 34px #ecd59299,0 10px 30px #000a;color:var(--gold2);font-family:Cinzel,serif;white-space:nowrap;pointer-events:none;animation:rise 2.4s ease-in-out forwards}
.rew b{font-size:15px;display:block}
.rn{font-size:32px;text-shadow:0 0 14px #ecd592}
@keyframes rise{0%{transform:translate(-50%,220%);opacity:0}18%{transform:translate(-50%,0);opacity:1}75%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,220%);opacity:0}}
.wk{display:flex;justify-content:space-between;align-items:center;margin:8px 0 14px;font-family:Cinzel,serif;color:var(--gold2)}
.wk .btn{padding:6px 16px;font-size:18px}
.lane{border:1px solid #c9a24b55;border-radius:12px;background:#1b150e;margin-bottom:12px;overflow:hidden}
.lane.today{border-color:var(--gold);box-shadow:0 0 18px #c9a24b33}
.lh{display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,#3a2d1a,#1b150e);font-family:Cinzel,serif;font-size:13px;color:var(--gold2)}
.lh span{color:var(--mute);font-size:12px}
.lh em{margin-left:auto;font-style:normal;border:1px solid #c9a24b88;border-radius:20px;padding:1px 9px;font-size:12px}
.lc{display:flex;gap:10px;overflow-x:auto;padding:10px 12px;scroll-snap-type:x proximity}
.mc{flex:none;width:158px;scroll-snap-align:start;background:linear-gradient(160deg,#2d2315,#241c12);border:1px solid var(--gold);border-radius:10px;padding:9px;font-size:12px;box-shadow:inset 0 0 0 2px #14110c}
.mc.late{border-color:var(--red)}
.mc h4{margin:4px 0;font-size:13px;line-height:1.2;font-weight:400;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mc .os{font-size:10px}
.mc select{width:100%;margin-top:6px;background:#14110c;color:var(--mute);border:1px solid #c9a24b55;border-radius:6px;padding:5px;font-size:12px}
.mc .btn.done{width:100%;margin-top:6px;padding:7px}
.lempty{padding:12px;color:var(--mute);font-style:italic;font-size:13px}
.chip{font-size:10px;color:#c2e0b0;border:1px solid #6f9a5f;border-radius:10px;padding:1px 6px}
.plan input[type=time]{background:#14110c;color:var(--gold2);border:1px solid #c9a24b66;border-radius:6px;padding:3px 6px;font-size:14px}
.plan .hint{display:block;margin-top:6px}
body{background:radial-gradient(ellipse at top,#3a2c1a,#120e09 70%) fixed,repeating-linear-gradient(45deg,#ffffff05 0 2px,transparent 2px 7px)}
.wrap{padding-top:84px}
.hud{position:fixed;top:0;left:0;right:0;z-index:45;display:flex;gap:12px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;background:linear-gradient(#0e0b07f2,#14110cee);border-bottom:1px solid var(--gold);box-shadow:0 4px 18px #000a}
.pt{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(#6a8a5e,#1f2c1c);overflow:hidden;flex:none;box-shadow:0 0 14px #c9a24b66}
.pt svg{width:100%;height:100%}
.hi{flex:1;min-width:0}
.hn{display:flex;justify-content:space-between;align-items:baseline;font-family:Cinzel,serif}
.hn b{color:var(--gold2);font-size:16px;letter-spacing:1px}.hn span{color:var(--mute);font-size:11px}
.xb{height:9px;border-radius:6px;background:#0c0905;border:1px solid #c9a24b88;overflow:hidden;margin-top:5px}
.xb i{display:block;height:100%;background:linear-gradient(90deg,#8a6a24,#ecd592);box-shadow:0 0 8px #ecd592;transition:width .6s}
.hi small{color:var(--mute);font-size:11px}
.tabs button{font-size:11px;letter-spacing:0;padding:15px 0}
.stage{height:360px;display:flex;justify-content:center;align-items:flex-end;background:radial-gradient(ellipse at 50% 90%,#5a4424,transparent 70%),linear-gradient(#1b2a1c,#14110c);border:1px solid var(--gold);border-radius:16px;margin:12px 0;overflow:hidden;box-shadow:inset 0 0 40px #000a}
.hero{height:100%;filter:drop-shadow(0 8px 10px #000a)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.slot{border:1px solid #c9a24b66;border-radius:10px;padding:8px 10px;background:#1b150e;font-size:13px}
.slot b{display:block;font-family:Cinzel,serif;font-size:10px;letter-spacing:1px;color:var(--gold)}
.slot.lk{opacity:.4}
.tr{display:flex;gap:12px;align-items:center;border:1px solid #c9a24b44;border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#1b150e;opacity:.72}
.tr.ok{opacity:1;border-color:var(--gold);box-shadow:0 0 14px #c9a24b33}
.ti{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid #c9a24b66;font-size:20px;color:var(--mute);flex:none}
.tr.ok .ti{background:radial-gradient(circle at 35% 30%,#ecd592,#8a6a24);color:#14110c;border-color:#14110c}
.tr div{flex:1}.tr b{font-family:Cinzel,serif;font-size:13px;color:var(--gold2)}
.tr small{display:block;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useMemo,useEffect}=React;const html=htm.bind(React.createElement);
const KEY='cronicas-os-v1';
const norm=s=>String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const COLS={num:['numero da os','numero os','no da os','n da os','os'],tipo:['tipo de os'],titulo:['titulo'],trabalho:['trabalho'],inicio:['data de inicio programada','inicio programada'],fim:['data de conclusao'],desc:['descricao']};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d?d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()):'';
const fromIso=s=>s?new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)):null;
const fmt=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'—';
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
function toDate(v){
  if(v===''||v==null)return null;
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
  const s=String(v),a=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(a)return new Date(+a[1],a[2]-1,+a[3]);
  const m=s.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,m[2]-1,+m[1])}
  return null;
}
function parseRows(rows){
  if(!rows.length)return[];
  const keys=Object.keys(rows[0]),pick={};
  for(const f in COLS)pick[f]=keys.find(k=>COLS[f].includes(norm(k)))||keys.find(k=>COLS[f].some(a=>a.length>6&&norm(k).includes(a)));
  return rows.map(r=>{
    const g=f=>pick[f]?r[pick[f]]:'',t=f=>String(g(f)).trim();
    return{num:t('num'),tipo:t('tipo'),titulo:t('titulo'),trabalho:t('trabalho'),desc:t('desc'),inicio:iso(toDate(g('inicio'))),fim:iso(toDate(g('fim')))};
  }).filter(o=>o.num||o.titulo);
}
function sample(){
  const t=new Date(),d=n=>{const x=new Date(t.getFullYear(),t.getMonth(),t.getDate()+n);return iso(x)};
  const L=[['Lubrificar rolamentos da esteira 3','Preventiva','Mecânica',-9,-6,'Aplicar graxa conforme plano, registrar quantidade e conferir vedações.'],
  ['Trocar filtro de ar do compressor','Preventiva','Mecânica',-4,-2,'Substituir elemento filtrante e limpar carcaça.'],
  ['Inspeção termográfica do painel PN-12','Preditiva','Elétrica',-1,0,'Registrar pontos quentes acima de 15 °C do ambiente.'],
  ['Reapertar bornes do CCM-02','Preventiva','Elétrica',0,2,'Torque conforme procedimento, com o equipamento desenergizado.'],
  ['Alinhar acoplamento da bomba B-07','Corretiva','Mecânica',1,3,'Vibração acima do limite na última medição.'],
  ['Calibrar sensor de nível do tanque 2','Preventiva','Instrumentação',3,5,'Verificar zero e span com padrão rastreável.'],
  ['Limpeza do trocador de calor','Preventiva','Mecânica',7,10,'Retirar incrustações e testar estanqueidade.'],
  ['Teste do disjuntor geral','Preditiva','Elétrica',8,9,'Teste funcional e inspeção visual.'],
  ['Revisar válvula de alívio V-21','Corretiva','Mecânica',14,17,'Reajustar pressão de abertura.']];
  return L.map((x,i)=>({num:String(48210+i),titulo:x[0],tipo:x[1],trabalho:x[2],inicio:d(x[3]),fim:d(x[4]),desc:x[5]}));
}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{orders:[],done:{}}}catch(e){return{orders:[],done:{}}}}
function weekLabel(k,today){
  if(k==='zz')return'Sem data definida';
  const s=fromIso(k),e=new Date(s);e.setDate(e.getDate()+4);
  const diff=Math.round((s-monday(today))/6048e5);
  return(diff<=0?'Esta semana':diff===1?'Próxima semana':'Semana')+' · '+fmt(iso(s))+' a '+fmt(iso(e));
}
function Card({o,onDone}){
  const[open,setOpen]=useState(false);
  return html`<article class=${'card'+(o.late?' late':'')} onClick=${()=>setOpen(!open)}>
    <div class="top"><span class="os">OS ${o.num}</span><span class="tag">${o.tipo||'Tarefa'}</span></div>
    <h3>${o.titulo||'Sem título'}</h3>
    ${o.trabalho&&html`<div class="work">${o.trabalho}</div>`}
    <div class="meta"><span>Início ${fmt(o.inicio)}</span><span>Prazo ${fmt(o.fim)}</span></div>
    ${o.late>0&&html`<div class="warn">⚔ ${o.late} ${o.late===1?'dia':'dias'} de atraso</div>`}
    ${o.desc&&html`<p class=${open?'desc open':'desc'}>${o.desc}</p>`}
    <button class="btn done" onClick=${e=>{e.stopPropagation();onDone(o)}}>Concluir</button>
  </article>`;
}
const WIN={dia:{t:'Durante o dia',h:'07:00–16:00'},cafe:{t:'Intervalo de café',h:'08:45–09:15'},almoco:{t:'Intervalo de almoço',h:'11:00–12:30'},nao:{t:'Não consigo hoje',h:''}};
const RUNES='ᚠᚢᚦᚨᚱᚲᚷᚹ';
function Deck({deck,answer,close}){
  const o=deck[0];
  return html`<div class="ov">
    <h1 style=${{fontSize:'20px'}}>Desafios de hoje</h1>
    <p class="cnt">${deck.length} ${deck.length===1?'carta restante':'cartas restantes'}</p>
    <div class="hs" key=${o.num+o.titulo}>
      <div class=${'gem'+(o.late>0?' red':'')}>${o.late>0?o.late:'☀'}<small>${o.late>0?(o.late===1?'dia':'dias'):'hoje'}</small></div>
      <div class="art">${RUNES[(o.tipo||'x').charCodeAt(0)%RUNES.length]}</div>
      <div class="banner">${o.titulo||'Sem título'}</div>
      <div class="type">${o.tipo||'Tarefa'}${o.trabalho?' · '+o.trabalho:''} · OS ${o.num}</div>
      <div class="box">${o.desc||'Sem descrição.'}</div>
      <div class="gem g2">${fmt(o.inicio)}<small>início</small></div>
      <div class="gem g3">${fmt(o.fim)}<small>prazo</small></div>
    </div>
    <div class="ask">Consegue realizar hoje?</div>
    <div class="opts">
      ${['dia','cafe','almoco','nao'].map(w=>html`<button key=${w} class=${'btn'+(w==='nao'?' ghost':'')} onClick=${()=>answer(o.num,w)}>${WIN[w].t}<small>${WIN[w].h||' '}</small></button>`)}
    </div>
    <button class="later" onClick=${close}>Decidir depois</button>
  </div>`;
}
const STAGES=[{n:'Camponês',at:0},{n:'Aprendiz',at:3},{n:'Soldado',at:8},{n:'Cavaleiro',at:15},{n:'Campeão',at:25},{n:'Lenda',at:40}];
const stageOf=n=>STAGES.reduce((s,x,i)=>n>=x.at?i:s,0);
const EQ=[['Armadura',0,['Túnica de linho','Couro curtido','Couro reforçado','Cota de malha','Placas de aço','Armadura dourada']],['Arma',1,['','Adaga','Espada de ferro','Espada de ferro','Espada de aço','Espada lendária']],['Braçadeiras',2,'Braçadeiras de couro'],['Ombreiras',4,'Ombreiras de aço'],['Capa',4,'Capa carmesim'],['Aura',5,'Aura lendária']];
const SK='#b8805a',HR='#2a1d14';
function Head(){return html`<g>
  <rect x="88" y="98" width="24" height="20" fill=${SK}/>
  <ellipse cx="70" cy="72" rx="5" ry="8" fill=${SK}/><ellipse cx="130" cy="72" rx="5" ry="8" fill=${SK}/>
  <ellipse cx="100" cy="70" rx="30" ry="35" fill=${SK}/>
  <path d="M68 64Q66 30 100 29Q134 30 132 64Q124 44 100 46Q76 44 68 64Z" fill=${HR}/>
  <circle cx="78" cy="40" r="7" fill=${HR}/><circle cx="92" cy="33" r="8" fill=${HR}/><circle cx="108" cy="33" r="8" fill=${HR}/><circle cx="122" cy="40" r="7" fill=${HR}/>
  <path d="M70 68Q68 112 100 114Q132 112 130 68Q126 92 100 92Q74 92 70 68Z" fill="#1c140e"/>
  <path d="M82 86Q100 77 118 86Q100 92 82 86Z" fill="#1c140e"/>
  <path d="M92 99Q100 104 108 99" stroke="#4a2c1c" strokeWidth="2" fill="none"/>
  <circle cx="86" cy="69" r="2.4" fill="#1a1210"/><circle cx="114" cy="69" r="2.4" fill="#1a1210"/>
  <path d="M77 60L95 59M105 59L123 60" stroke=${HR} strokeWidth="3"/>
  <rect x="75" y="61" width="23" height="15" rx="3" fill="#ffffff14" stroke="#101010" strokeWidth="2.6"/><rect x="102" y="61" width="23" height="15" rx="3" fill="#ffffff14" stroke="#101010" strokeWidth="2.6"/><path d="M98 66L102 66" stroke="#101010" strokeWidth="2.4"/>
</g>`}
function Hero({st}){
  const sc=.78+st*.08,met=['','','#8d9299','#9aa3ad','#b9c3cf','#dcb54a'][st],tor=['#cdbd9a','#8a5a33','#7a4d2b','#8d9299','#b9c3cf','#dcb54a'][st],tr=st>=5?'#8a5a12':'#4a3320';
  return html`<svg viewBox="0 0 200 300" class="hero">
   <defs><radialGradient id="au"><stop offset="0" stopColor="#ecd592" stopOpacity=".6"/><stop offset="1" stopColor="#ecd592" stopOpacity="0"/></radialGradient></defs>
   ${st>=5&&html`<circle cx="100" cy="170" r="135" fill="url(#au)"/>`}
   <ellipse cx="100" cy="290" rx=${50*sc+10} ry="8" fill="#0008"/>
   <g transform=${'translate(100 290) scale('+sc+') translate(-100 -290)'}>
    ${st>=4&&html`<path d="M60 118Q36 210 52 282L148 282Q164 210 140 118Z" fill="#7a1f1a"/>`}
    <rect x="72" y="196" width="24" height="82" rx="6" fill="#2b2a2e"/><rect x="104" y="196" width="24" height="82" rx="6" fill="#2b2a2e"/>
    <rect x="66" y="268" width="34" height="22" rx="7" fill="#3a2a1c"/><rect x="100" y="268" width="34" height="22" rx="7" fill="#3a2a1c"/>
    <rect x="40" y="120" width="26" height="80" rx="12" fill=${SK}/><rect x="134" y="120" width="26" height="80" rx="12" fill=${SK}/>
    <path d="M62 116Q100 104 138 116L142 206L58 206Z" fill=${tor}/>
    ${st===3&&html`<path d="M66 130h68M66 144h68M66 158h68M66 172h68M66 186h68" stroke="#5d646c" strokeWidth="2" strokeDasharray="3 3"/>`}
    ${st>=4&&html`<path d="M100 112V204" stroke=${tr} strokeWidth="3"/>`}
    <rect x="58" y="198" width="84" height="11" fill=${tr}/><rect x="94" y="197" width="12" height="13" rx="2" fill="#dcb54a"/>
    ${st>=2&&html`<rect x="38" y="164" width="30" height="26" rx="8" fill=${st>=4?met:'#5a3a20'}/><rect x="132" y="164" width="30" height="26" rx="8" fill=${st>=4?met:'#5a3a20'}/>`}
    ${st>=4&&html`<ellipse cx="54" cy="122" rx="22" ry="15" fill=${met}/><ellipse cx="146" cy="122" rx="22" ry="15" fill=${met}/>`}
    <${Head}/>
    ${st>=1&&html`<g>${st>=5&&html`<rect x="140" y="52" width="16" height="152" rx="6" fill="#ffe9a8" opacity=".35"/>`}
      <rect x="144" y=${st===1?150:70} width="8" height=${st===1?46:128} fill=${st>=5?'#fff3c4':'#d5dbe2'} stroke="#7b8590"/>
      ${st>=2&&html`<path d="M144 70L148 56L152 70Z" fill=${st>=5?'#fff3c4':'#d5dbe2'} stroke="#7b8590"/>`}
      <rect x="134" y="196" width="28" height="7" rx="3" fill="#dcb54a"/><rect x="144" y="203" width="8" height="18" rx="3" fill="#4a3320"/><circle cx="148" cy="208" r="9" fill=${SK}/></g>`}
   </g></svg>`;
}
function Hud({lv,pct,xp,stage}){return html`<header class="hud"><div class="pt"><svg viewBox="58 22 84 94"><${Head}/></svg></div><div class="hi"><div class="hn"><b>Frannklin</b><span>${STAGES[stage].n} · Nv ${lv}</span></div><div class="xb"><i style=${{width:pct+'%'}}></i></div><small>${xp} XP</small></div></header>`}
function App(){
  const[deckOpen,setDeckOpen]=useState(true);const[wk,setWk]=useState(0);const[tab,setTab]=useState('home');const[reward,setReward]=useState(null);
  const[st,setSt]=useState(load);const[msg,setMsg]=useState('');
  const today=useMemo(()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())},[]);
  const save=s=>{setSt(s);try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}};
  const onFile=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
      const orders=parseRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{raw:true,defval:''}));
      if(!orders.length){setMsg('Nenhuma ordem encontrada. Confira os nomes das colunas.')}
      else{save({orders,done:st.done});setMsg(orders.length+' desafios revelados')}
    }catch(err){setMsg('Não foi possível ler a planilha.')}
    e.target.value='';
  };
  const{lateList,groups,total,list}=useMemo(()=>{
    const list=st.orders.filter(o=>!st.done[o.num]).map(o=>{
      const fim=fromIso(o.fim),ini=fromIso(o.inicio),due=fim||ini;
      const late=due&&due<today?Math.round((today-due)/864e5):0;
      return{...o,late,g:(ini&&ini>=today)?ini:(fim||ini)};
    });
    const lateList=list.filter(o=>o.late>0).sort((a,b)=>b.late-a.late),map={};
    list.filter(o=>!o.late).forEach(o=>{const k=o.g?iso(monday(o.g)):'zz';(map[k]=map[k]||[]).push(o)});
    const groups=Object.keys(map).sort().map(k=>({k,items:map[k].sort((a,b)=>(a.g||0)-(b.g||0))}));
    return{lateList,groups,total:list.length,list};
  },[st,today]);
  const thisWeek=groups.find(g=>g.k===iso(monday(today)));
  const todayIso=iso(today),ans=(st.plan&&st.plan.d===todayIso)?st.plan.a:{};
  const deck=list.filter(o=>(o.late>0||(o.inicio&&o.inicio<=todayIso))&&!ans[o.num]).sort((a,b)=>b.late-a.late);
  const planned=list.filter(o=>['dia','cafe','almoco'].includes(ans[o.num]));
  const answer=(num,w)=>save({...st,plan:{d:todayIso,a:{...ans,[num]:w}}});
  const finish=o=>{const xp=10+(o.late>0?5:0);save({...st,done:{...st.done,[o.num]:{num:o.num,titulo:o.titulo,tipo:o.tipo,trabalho:o.trabalho,late:o.late,xp,d:todayIso,at:new Date().toISOString()}}});{const nx=xpTotal+xp;let msg='Desafio cumprido!';if(Math.floor(nx/50)>Math.floor(xpTotal/50))msg='Nível '+(Math.floor(nx/50)+1)+'!';else if(stageOf(doneList.length+1)>stageOf(doneList.length))msg='Novo equipamento!';setReward({xp,k:Date.now(),msg});setTimeout(()=>setReward(null),2600)}};
  const undo=n=>{const d={...st.done};delete d[n];save({...st,done:d})};
  const doneList=Object.values(st.done).sort((a,b)=>b.at.localeCompare(a.at));
  const xpTotal=doneList.reduce((s,x)=>s+(x.xp||0),0);
  const moved=st.moved||{};
  const place=o=>moved[o.num]||(o.late>0?todayIso:(o.inicio||o.fim||todayIso)>todayIso?(o.inicio||o.fim):todayIso);
  const move=(n,d)=>save({...st,moved:{...moved,[n]:d}});
  const todays=list.filter(o=>place(o)===todayIso).sort((a,b)=>b.late-a.late);
  const NT=st.nt||{on:false,time:'07:00',last:''};
  const notify=async()=>{
    if(!('Notification' in window)||Notification.permission!=='granted'||!todays.length)return false;
    const t=todays.length+(todays.length===1?' desafio':' desafios')+' hoje';
    const b=todays.slice(0,3).map(o=>'OS '+o.num+' · '+o.titulo).join('\n')+(todays.length>3?'\n+'+(todays.length-3)+' mais':'');
    try{const r=await navigator.serviceWorker.getRegistration();if(r){await r.showNotification(t,{body:b,icon:'icon-192.png',tag:'diario'});return true}}catch(e){}
    try{new Notification(t,{body:b,icon:'icon-192.png',tag:'diario'});return true}catch(e){return false}
  };
  const enableNt=async()=>{
    if(!('Notification' in window)){setMsg('Este navegador não oferece notificações.');return}
    const p=await Notification.requestPermission();
    if(p==='granted'){save({...st,nt:{on:true,time:'07:00',last:''}});setMsg('Lembrete diário ativado')}else setMsg('Permissão de notificação negada.');
  };
  useEffect(()=>{
    const tick=async()=>{const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes());
      if(NT.on&&NT.last!==iso(n)&&hm>=NT.time&&todays.length&&await notify())save({...st,nt:{...NT,last:iso(n)}})};
    tick();const id=setInterval(tick,30000);
    const vis=()=>{if(!document.hidden)tick()};document.addEventListener('visibilitychange',vis);
    return()=>{clearInterval(id);document.removeEventListener('visibilitychange',vis)};
  });
  const cnt=doneList.length,stage=stageOf(cnt),lv=Math.floor(xpTotal/50)+1,pct=(xpTotal%50)*2;
  const per={};doneList.forEach(x=>{per[x.d]=(per[x.d]||0)+1});
  let streak=0,run=0,pv=null;Object.keys(per).sort().forEach(d=>{run=pv&&Math.round((fromIso(d)-fromIso(pv))/864e5)===1?run+1:1;pv=d;streak=Math.max(streak,run)});
  const lateN=doneList.filter(x=>x.late>0).length,prevN=doneList.filter(x=>/prev/i.test(x.tipo||'')).length,best=Math.max(0,...Object.values(per));
  const prog=[['first','Primeiro Sangue','Conclua 1 OS',cnt,1],['five','Aprendiz da Forja','Conclua 5 OS',cnt,5],['ten','Veterano de Guerra','Conclua 10 OS',cnt,10],['t25','Campeão da Guilda','Conclua 25 OS',cnt,25],['t50','Lenda da Terra Média','Conclua 50 OS',cnt,50],['l3','Caçador de Sombras','Conclua 3 OS atrasadas',lateN,3],['l10','Quebra-Correntes','Conclua 10 OS atrasadas',lateN,10],['c3','Combo Triplo','3 OS no mesmo dia',best,3],['c5','Fúria do Guerreiro','5 OS no mesmo dia',best,5],['pv','Mestre da Forja','Conclua 5 OS preventivas',prevN,5],['sk','Chama Constante','3 dias seguidos com OS concluídas',streak,3],['xp','Tesouro de Erebor','Alcance 200 XP',xpTotal,200]].map(a=>({id:a[0],t:a[1],d:a[2],v:Math.min(a[3],a[4]),max:a[4]}));
  useEffect(()=>{const got=prog.filter(a=>a.v>=a.max&&!(st.ach||{})[a.id]);if(!got.length)return;const ach={...st.ach};got.forEach(a=>{ach[a.id]=todayIso});save({...st,ach});setTimeout(()=>{setReward({xp:0,k:Date.now(),msg:'Conquista: '+got[0].t});setTimeout(()=>setReward(null),2600)},reward?2700:0)});
  const nav=html`<${React.Fragment}><${Hud} lv=${lv} pct=${pct} xp=${xpTotal} stage=${stage}/><nav class="tabs"><button class=${tab==='home'?'on':''} onClick=${()=>setTab('home')}>Jornada</button><button class=${tab==='week'?'on':''} onClick=${()=>setTab('week')}>Semana</button><button class=${tab==='hero'?'on':''} onClick=${()=>setTab('hero')}>Herói</button><button class=${tab==='ach'?'on':''} onClick=${()=>setTab('ach')}>Troféus</button><button class=${tab==='done'?'on':''} onClick=${()=>setTab('done')}>Feitos · ${doneList.length}</button></nav></${React.Fragment}>`;
  const rew=reward&&html`<div class="rew" key=${reward.k}><span class="rn">ᚠ</span><div><b>${reward.msg||'Desafio cumprido!'}</b>${reward.xp>0&&html`<div>+${reward.xp} XP</div>`}</div></div>`;
  if(tab==='hero'){
    const nx=STAGES[stage+1];
    return html`<div class="wrap">${nav}${rew}
      <h1>Frannklin</h1><p class="sub">${STAGES[stage].n} · Nível ${lv}</p>
      <div class="stage"><${Hero} st=${stage}/></div>
      <div class="plan"><b>Próxima evolução</b>${nx?nx.n+' aos '+nx.at+' OS · faltam '+(nx.at-cnt):'Poder máximo alcançado'}<div class="xb"><i style=${{width:(nx?Math.min(100,(cnt-STAGES[stage].at)/(nx.at-STAGES[stage].at)*100):100)+'%'}}></i></div></div>
      <div class="slots">${EQ.map(e=>html`<div class=${'slot'+(stage<e[1]?' lk':'')} key=${e[0]}><b>${e[0]}</b>${stage>=e[1]?(Array.isArray(e[2])?e[2][stage]:e[2]):'Bloqueado'}</div>`)}</div>
    </div>`;
  }
  if(tab==='ach')return html`<div class="wrap">${nav}${rew}
    <h1>Conquistas</h1><p class="sub">${prog.filter(a=>a.v>=a.max).length} de ${prog.length} desbloqueadas</p><div class="orn"></div>
    ${prog.map(a=>{const ok=a.v>=a.max;return html`<div class=${'tr'+(ok?' ok':'')} key=${a.id}><span class="ti">${ok?'★':'✧'}</span><div><b>${a.t}</b><small>${a.d}</small>${!ok&&html`<div class="xb"><i style=${{width:a.v/a.max*100+'%'}}></i></div>`}</div></div>`})}
  </div>`;
  if(tab==='week'){
    const ws=monday(today);ws.setDate(ws.getDate()+wk*7);
    const ds=[0,1,2,3,4,5,6].map(i=>{const d=new Date(ws);d.setDate(d.getDate()+i);return d});
    const lanes=ds.map(d=>({d,items:list.filter(o=>place(o)===iso(d)).sort((a,b)=>b.late-a.late)})).filter((l,i)=>i<5||l.items.length);
    const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],CH={dia:'Dia',cafe:'Café',almoco:'Almoço'};
    return html`<div class="wrap">${nav}${rew}
      <h1>Baias da Semana</h1><p class="sub">Cada carta na baia do dia em que será cumprida</p><div class="orn"></div>
      <div class="wk"><button class="btn ghost" disabled=${wk<=0} onClick=${()=>setWk(wk-1)}>‹</button><span>${fmt(iso(ds[0]))} a ${fmt(iso(ds[6]))}</span><button class="btn ghost" onClick=${()=>setWk(wk+1)}>›</button></div>
      ${lanes.map(({d,items})=>html`<section class=${'lane'+(iso(d)===todayIso?' today':'')} key=${iso(d)}>
        <div class="lh"><b>${DN[d.getDay()]}</b><span>${fmt(iso(d))}</span><em>${items.length}</em></div>
        ${items.length?html`<div class="lc">${items.map(o=>html`<div class=${'mc'+(o.late>0?' late':'')} key=${o.num+o.titulo}>
          <span class="os">OS ${o.num}</span>${iso(d)===todayIso&&CH[ans[o.num]]&&html` <span class="chip">${CH[ans[o.num]]}</span>`}
          <h4>${o.titulo}</h4>
          ${o.late>0&&html`<div class="warn" style=${{margin:0,fontSize:'12px'}}>⚔ ${o.late} d de atraso</div>`}
          <select value=${place(o)} onChange=${e=>move(o.num,e.target.value)}>${ds.map(x=>html`<option key=${iso(x)} value=${iso(x)}>${DN[x.getDay()]} ${fmt(iso(x))}</option>`)}</select>
          <button class="btn done" onClick=${()=>finish(o)}>Concluir</button></div>`)}</div>`:html`<div class="lempty">Baia livre</div>`}
      </section>`)}
    </div>`;
  }
  if(tab==='done')return html`<div class="wrap">${nav}${rew}
    <h1>Feitos da Jornada</h1>
    <p class="sub">${doneList.length} ${doneList.length===1?'desafio cumprido':'desafios cumpridos'} · ${xpTotal} XP</p>
    <div class="orn"></div>
    ${doneList.length===0&&html`<div class="empty">Nenhum desafio cumprido ainda.<br/>Conclua uma OS na aba Jornada.</div>`}
    ${[...new Set(doneList.map(x=>x.d||x.at.slice(0,10)))].map(d=>html`<div key=${d}><h2>${fmt(d)}</h2>${doneList.filter(x=>(x.d||x.at.slice(0,10))===d).map(x=>html`<div class="plan" key=${x.num}><b>OS ${x.num} · ${x.tipo||'Tarefa'}</b>${x.titulo}<div class="prow"><i>+${x.xp} XP</i><button class="later" style=${{margin:0}} onClick=${()=>undo(x.num)}>Desfazer</button></div></div>`)}</div>`)}
  </div>`;
  return html`<div class="wrap">
    ${deckOpen&&deck.length>0&&html`<${Deck} deck=${deck} answer=${answer} close=${()=>setDeckOpen(false)}/>`}
    ${nav}${rew}
    <h1>Crônicas da Manutenção</h1>
    <p class="sub">Cada ordem, uma jornada a cumprir</p>
    <div class="orn"></div>
    <div class="stats">
      <div class="stat red"><b>${lateList.length}</b><span>Atrasadas</span></div>
      <div class="stat"><b>${thisWeek?thisWeek.items.length:0}</b><span>Esta semana</span></div>
      <div class="stat"><b>${total}</b><span>Em aberto</span></div>
    </div>
    <div class="actions">
      <label class="btn">Importar planilha<input type="file" accept=".xlsx,.xls,.csv" hidden onChange=${onFile}/></label>
      ${total>0&&html`<button class="btn ghost" onClick=${()=>{save({orders:[],done:{}});setMsg('')}}>Limpar</button>`}
    </div>
    ${msg&&html`<div class="msg">${msg}</div>`}
    <div class="plan" style=${{marginTop:'14px'}}><b>Lembrete diário</b>
      ${NT.on?html`<div class="prow"><span>Todo dia às <input type="time" value=${NT.time} onChange=${e=>save({...st,nt:{...NT,time:e.target.value||'07:00',last:''}})}/></span><button class="btn ghost done" onClick=${()=>save({...st,nt:{...NT,on:false}})}>Desligar</button></div>`:html`<button class="btn done" style=${{margin:0}} onClick=${enableNt}>Ativar lembrete</button>`}
      <i class="hint">Avisa ao abrir o app e enquanto ele estiver ativo. Instale na tela inicial para melhor resultado.</i></div>
    ${deck.length>0&&!deckOpen&&html`<div class="actions" style=${{marginTop:'12px'}}><button class="btn" onClick=${()=>setDeckOpen(true)}>Desafios de hoje (${deck.length})</button></div>`}
    ${planned.length>0&&html`<h2>Plano de hoje</h2>${['dia','cafe','almoco'].map(w=>{const it=planned.filter(o=>ans[o.num]===w);return it.length?html`<div class="plan" key=${w}><b>${WIN[w].t} · ${WIN[w].h}</b>${it.map(o=>html`<div class="prow" key=${o.num+o.titulo}><span>${o.titulo} <i>OS ${o.num}</i></span><button class="btn done" onClick=${()=>finish(o)}>Concluir</button></div>`)}</div>`:null})}`}
    ${total===0&&html`<div class="empty">Nenhum desafio no horizonte.<br/>Importe a planilha de ordens para começar a jornada.<br/><br/>
      <button class="btn ghost" onClick=${()=>save({orders:sample(),done:st.done})}>Ver exemplo</button></div>`}
    ${lateList.length>0&&html`<h2 class="red">Atrasadas</h2>${lateList.map(o=>html`<${Card} key=${o.num+o.titulo} o=${o} onDone=${finish}/>`)}`}
    ${groups.map(g=>html`<div key=${g.k}><h2>${weekLabel(g.k,today)}</h2>${g.items.map(o=>html`<${Card} key=${o.num+o.titulo} o=${o} onDone=${finish}/>`)}</div>`)}
  </div>`;
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
